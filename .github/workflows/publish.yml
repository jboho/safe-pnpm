name: Publish

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Trusted publishing: npm exchanges this run's OIDC token for a short-lived
      # publish credential, so no NPM_TOKEN secret is stored or rotated.
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - run: npm test
      - run: npm run lint

      # Fail fast if the tag and the manifest disagree, so we never publish a
      # version that doesn't match the tag that triggered the run.
      - name: Verify tag matches package version
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          pkg_version="$(node -p "require('./package.json').version")"
          if [ "$tag_version" != "$pkg_version" ]; then
            echo "Tag $GITHUB_REF_NAME (=$tag_version) does not match package.json version $pkg_version" >&2
            exit 1
          fi

      # Publish the scoped package publicly to the npm registry via trusted
      # publishing (https://docs.npmjs.com/trusted-publishers/). Requires the
      # trusted publisher configured on npmjs.com for jboho/safe-pnpm + publish.yml.
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          scope: '@jboho'
      # Trusted publishing needs npm >= 11.5.1.
      - run: npm install -g npm@^11.5.1
      - run: npm publish --access public --provenance
