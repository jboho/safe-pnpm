name: Publish

on:
  push:
    tags:
      - 'v*'

# Actions are pinned to commit SHAs (the comment is the tag they were resolved
# from) so a moved or compromised tag cannot change what runs with id-token.
jobs:
  verify:
    runs-on: ubuntu-latest
    # No id-token here: this job installs dependencies and runs repo code, which
    # is exactly what must not be able to mint a publish credential.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
      - run: npm ci
      - run: npm test
      - run: npm run lint

      # Fail fast if the tag and the manifest disagree, so we never publish a
      # version that doesn't match the tag that triggered the run.
      - name: Verify tag matches package version
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          pkg_version="$(node -p "require('./package.json').version")"
          if [ "$tag_version" != "$pkg_version" ]; then
            echo "Tag $GITHUB_REF_NAME (=$tag_version) does not match package.json version $pkg_version" >&2
            exit 1
          fi

  publish:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Trusted publishing: npm exchanges this run's OIDC token for a short-lived
      # publish credential, so no NPM_TOKEN secret is stored or rotated.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Publish the scoped package publicly to the npm registry via trusted
      # publishing (https://docs.npmjs.com/trusted-publishers/). Requires the
      # trusted publisher configured on npmjs.com for jboho/safe-pnpm + publish.yml.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          scope: '@jboho'
      # Trusted publishing needs npm >= 11.5.1. Pinned exactly: a floating range
      # would run whatever npm published last inside the job that holds id-token.
      - run: npm install -g npm@11.19.1
      # No dependencies are installed in this job and lifecycle scripts are off,
      # so nothing but the package's own files runs while id-token is available.
      # Provenance is only supported from public repos; forcing it from a private
      # repo fails the publish, so enable it only once the repo is public.
      - run: npm publish --access public --ignore-scripts --loglevel=verbose --provenance=${{ !github.event.repository.private }}
