name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ['20', '22']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node-version }}
      # zsh and fish are not on ubuntu-latest; without them their wrapper tests
      # skip silently, leaving two of the three shell paths untested in CI.
      - run: sudo apt-get update && sudo apt-get install -y zsh fish
      - run: npm ci
      - run: npm test
      - run: npm run lint
